apiVersion: v2
name: rancher-turtles-providers
description: This chart installs the Rancher Turtles certified providers.
home: https://turtles.docs.rancher.com/turtles/stable/en/overview/certified.html
icon: https://raw.githubusercontent.com/rancher/turtles/main/logos/capi.svg
version: 0.28.0-rc.0
appVersion: "0.28.0-rc.0"
keywords:
  - rancher
  - cluster-api
  - capi
  - provisioning
  - provider
annotations:
  catalog.cattle.io/certified: rancher
  catalog.cattle.io/display-name: Rancher Turtles Certified Providers
  catalog.cattle.io/kube-version: ">= 1.35.0-0 < 1.38.0-0"
  catalog.cattle.io/namespace: cattle-turtles-system
  catalog.cattle.io/os: linux
  catalog.cattle.io/permits-os: linux
  catalog.cattle.io/rancher-version: ">= 2.15.0-0 < 2.17.0-0"
  catalog.cattle.io/release-name: rancher-turtles-providers
  catalog.cattle.io/scope: management
  catalog.cattle.io/type: cluster-tool
  helm.sh/images: |
    - name: cluster-api-addon-provider-fleet
      image: rancher/cluster-api-addon-provider-fleet:v0.15.0
    - name: kubeadm-bootstrap-controller
      image: rancher/kubeadm-bootstrap-controller:v1.14.2
    - name: cluster-api-provider-rke2-bootstrap
      image: rancher/cluster-api-provider-rke2-bootstrap:v0.27.0-rc.1
    - name: kubeadm-control-plane-controller
      image: rancher/kubeadm-control-plane-controller:v1.14.2
    - name: cluster-api-provider-rke2-controlplane
      image: rancher/cluster-api-provider-rke2-controlplane:v0.27.0-rc.1
    - name: cluster-api-aws-controller
      image: rancher/cluster-api-aws-controller:v2.13.0
    - name: cluster-api-azure-controller
      image: rancher/cluster-api-azure-controller:v1.27.0
    - name: azureserviceoperator
      image: rancher/azureserviceoperator:v2.19.0
    - name: cluster-api-gcp-controller
      image: rancher/cluster-api-gcp-controller:v1.13.1
    - name: cluster-api-vsphere-controller
      image: rancher/cluster-api-vsphere-controller:v1.17.0
maintainers:
  - name: Rancher Highlander Team
    url: https://github.com/rancher/turtles
