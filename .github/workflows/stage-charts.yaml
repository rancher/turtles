name: Stage the chart in the Rancher catalog

# Sends the rancher-turtles chart of a release to the staging registry of the Rancher catalog and
# has rancher/charts ship it: the chart attached to the release is stamped with its final version,
# checked against the catalog rules, packaged and pushed to stgregistry.suse.com/rancher/catalog,
# and rancher/charts opens a pull request with it against its staging branch.
#
# release.yaml calls it for every tag, after chart-release.yml has attached the chart to the
# release and published it. It can also be run by hand, from the default branch, naming the tag:
#
#   gh workflow run stage-charts.yaml --repo rancher/turtles --ref main -f tag=v0.28.0-rc.6
#
# The final version, 1XY.Z.W+upA.B.C, is worked out from the appVersion of the chart and the
# versions already released. The catalog checks need two things in the chart at the tag that
# this workflow does not change: both bounds in catalog.cattle.io/rancher-version and
# catalog.cattle.io/kube-version, and a `dependency` on each entry of the helm.sh/images
# annotation whose image is not in values.yaml. The action fails before it pushes anything
# when they are not right.

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag to stage, such as v0.28.0-rc.6"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to stage, such as v0.28.0-rc.6"
        required: true
        type: string

permissions: {}

# Two runs of the same tag could push at the same time, and the check that the version is not
# in the registry yet and the push are two calls. A second run waits.
concurrency:
  group: stage-turtles-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  stage-chart:
    name: Stage the chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to log in to Vault with the OIDC token
    steps:
      # A run by hand logs in to Vault with the workflow of the ref it is started from, so it must
      # be the default branch. When release.yaml calls it, it runs on the tag of the release.
      - name: Require the default branch
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "$DEFAULT_REF" ]; then
            echo "::error::Run this workflow from the default branch, not from $GITHUB_REF"
            exit 1
          fi

      # chart-release.yml attaches the chart to the release and publishes it. A release candidate
      # is a prerelease and is fine, since that is what Rancher pins, but a draft is not: the chart
      # would be staged for an image that may not be there.
      - name: Require a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq 'select(.isDraft == false)' > "$RUNNER_TEMP/release.json"
          if [ ! -s "$RUNNER_TEMP/release.json" ]; then
            echo "::error::The release $TAG is not published: publish it, after its images are pushed, before its chart is staged"
            exit 1
          fi

      # The chart the release built and attached, with its appVersion set. The download fails when
      # the release has no chart. The tag is data, not trusted input: it goes through the
      # environment.
      - name: Download the chart of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "rancher-turtles-${TAG#v}.tgz" --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/charts"
          tar -xzf "$RUNNER_TEMP/rancher-turtles-${TAG#v}.tgz" -C "$RUNNER_TEMP/charts"

      # The version is worked out by cargueiro from the appVersion and the versions that are
      # already released.
      - name: Stamp, check, package and push the chart, and start the shipping
        uses: rancher/charts/.github/actions/ship-staged@chart-owners
        with:
          chart-dir: ${{ runner.temp }}/charts/rancher-turtles
