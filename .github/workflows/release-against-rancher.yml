name: Release Turtles against rancher/rancher

# Opens a PR in rancher/rancher that sets turtlesVersion to the chart of a new Turtles release.
# Run it once the chart is in rancher/charts.

on:
  workflow_dispatch:
    inputs:
      rancher_ref:
        description: "Submit PR against the following rancher/rancher branch (e.g. release/v2.14). Use 'auto' to derive it from the rancher-version annotation of the chart at the new Turtles tag."
        required: true
        default: "auto"
      prev_turtles:
        description: "Previous Turtles version (eg: v0.23.0-rc.0)"
        required: true
        default: ""
      new_turtles:
        description: "New Turtles version (e.g. v0.23.0)"
        required: true
        default: ""

env:
  TURTLES_REF: ${{ github.ref_name }}
  PREV_TURTLES: ${{ inputs.prev_turtles }}
  NEW_TURTLES: ${{ inputs.new_turtles }}
  OWNER: ${{ github.repository_owner }}

jobs:
  create-rancher-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for Vault
    steps:
      # ">= 2.16.0-0 < 2.17.0-0" in the chart's rancher-version annotation means Rancher 2.16.
      - name: Find the Rancher version
        env:
          GH_TOKEN: ${{ github.token }}
          RANCHER_REF_INPUT: ${{ inputs.rancher_ref }}
        run: |
          set -euo pipefail
          range=$(gh api "repos/$GITHUB_REPOSITORY/contents/charts/rancher-turtles/Chart.yaml?ref=$NEW_TURTLES" \
            -H 'Accept: application/vnd.github.raw' | yq '.annotations["catalog.cattle.io/rancher-version"]')
          re='^>= *([0-9]+\.[0-9]+)'
          if ! [[ "$range" =~ $re ]]; then
            echo "::error::Cannot read the Rancher version from '$range' in the chart at $NEW_TURTLES"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          ref="$RANCHER_REF_INPUT"
          if [ "$ref" = "auto" ]; then ref="release/v$version"; fi
          echo "Rancher $version, branch $ref"
          echo "RANCHER_VERSION=$version" >> "$GITHUB_ENV"
          echo "RANCHER_REF=$ref" >> "$GITHUB_ENV"

      # Look in the catalog (staging) first, then in dev-v2.X for release lines not in the catalog.
      # Rancher <=2.15 are not in catalog.
      - name: Find the chart version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prints the chart versions for NEW_TURTLES (ending in +up0.28.0) in <branch>:<folder>.
          find_versions() {
            for file in $(gh api "repos/$OWNER/charts/git/trees/$1:$2" --jq '.tree[].path' || true); do
              if [[ "${file%.yaml}" == *"+up${NEW_TURTLES#v}" ]]; then echo "${file%.yaml}"; fi
            done
          }
          versions=$(find_versions staging entries/rancher-turtles)
          if [ -z "$versions" ]; then
            versions=$(find_versions "dev-v$RANCHER_VERSION" charts/rancher-turtles)
          fi
          chart=$(echo "$versions" | sort -V | tail -1)
          if [ -z "$chart" ]; then
            echo "::error::rancher-turtles $NEW_TURTLES is not in rancher/charts (staging or dev-v$RANCHER_VERSION)"
            exit 1
          fi
          echo "Chart $chart"
          echo "NEW_CHART=$chart" >> "$GITHUB_ENV"

      - name: Checkout rancher/turtles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TURTLES_REF }}
          path: turtles

      - name: Read the rancher/rancher token
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6
        with:
          secrets: |
            github/token/rancher--rancher--pull_requests--write token | GH_TOKEN

      - name: Checkout rancher/rancher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/rancher
          ref: ${{ env.RANCHER_REF }}
          token: ${{ env.GH_TOKEN }}
          path: rancher
          persist-credentials: true # to push the PR branch

      - name: Configure the committer
        env:
          APP_USER: ${{ github.actor }}
        run: |
          user_id=$(gh api "/users/$APP_USER" --jq .id)
          git config --global user.name "$APP_USER"
          git config --global user.email "${user_id}+${APP_USER}@users.noreply.github.com"

      - name: Bump turtlesVersion
        working-directory: rancher
        run: |
          branch="bump-turtles-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          git checkout -b "$branch" "$RANCHER_REF"
          ../turtles/.github/scripts/release-against-rancher.sh . "$NEW_TURTLES" "$NEW_CHART"

      - name: Open the pull request
        working-directory: rancher
        run: |
          git push origin "$BRANCH"
          body=$(../turtles/.github/scripts/release-message.sh "$PREV_TURTLES" "$NEW_TURTLES")
          gh pr create \
            --repo "$OWNER/rancher" \
            --base "$RANCHER_REF" \
            --head "$OWNER:$BRANCH" \
            --title "[$RANCHER_REF] Bump rancher-turtles to $NEW_TURTLES" \
            --body "$body"
