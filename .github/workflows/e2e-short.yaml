name: Run short e2e tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  MANAGEMENT_CLUSTER_ENVIRONMENT: "isolated-kind"
  GINKGO_LABEL_FILTER: "short"
  TAG: v0.0.1
  SOURCE_REPO: https://github.com/${{ github.event.pull_request.head.repo.full_name }}

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: runs-on,runner=4cpu-linux-x64,run-id=${{ github.run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Generic
            suites: test/e2e/suites/chart-upgrade test/e2e/suites/capiprovider
          - name: Provisioning
            suites: test/e2e/suites/rancher-managed-fleet
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: setupGo
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Display docker version
        run: docker version
      - name: Run e2e tests
        run: make test-e2e GINKGO_TESTS="${{ matrix.suites }}"
      - name: Collect run artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts_${{ matrix.name }}
          path: _artifacts
