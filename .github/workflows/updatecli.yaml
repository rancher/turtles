---
# NOTE: this workflow is currently disabled (see `if: false`)
name: "Updatecli"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: "write"
  pull-requests: "write"

jobs:
  updatecli:
    # disable this workflow temporarily until we optimize its configuration
    # currently, we tend to ignore the majority of PRs it creates and end up applying the changes manually
    if: false
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@5d180ff09f5204e599bbd6030cd1736009ed5ff2 # v3.9.0

      - name: Apply
        run: "updatecli apply --config ./updatecli/updatecli.d"
        env:
          UPDATECLI_GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          UPDATECLI_GITHUB_ACTOR: ${{ github.actor }}
